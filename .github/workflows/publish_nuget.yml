name: Publish NuGet Packages

on:
  release:
    types: [ published ]

jobs:
  publish_nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OpenApiJson: https://www.keycloak.org/docs-api/26.8.2/rest-api/openapi.json
      PublishFolder: Keycloak.RestApiClient.${{github.ref_name}}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Setup Node 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '21'
    - name: Build NuGet package
      run: ./build.cmd BuildClient
    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish NuGet package
      env:
        NuGetApiKey: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: ./build.cmd PublishClient --skip
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: Keycloak.RestApiClient.${{github.ref_name}}
        path: Keycloak.RestApiClient.${{github.ref_name}}
